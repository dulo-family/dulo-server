# Built-in defaults. Override them with a YAML file (DULO_CONFIG_FILE, default
# /config/dulo.yaml) or environment variables (highest precedence).
spring:
  application:
    name: dulo-server
  config:
    import: optional:file:${DULO_CONFIG_FILE:/config/dulo.yaml}
  datasource:
    url: ${dulo.database.url}
    username: ${dulo.database.username:}
    password: ${dulo.database.password:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      # Instants are stored as UTC in plain timestamp columns, which every supported database has.
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      # Loads the collections of a page of records, such as people's names, in a few queries
      # instead of one per record.
      hibernate.default_batch_fetch_size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
    # Logs a warning with the reason whenever a request fails with a handled exception, such as an
    # unreadable body or a denied access check.
    log-resolved-exception: true
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # One line per request on standard output, next to the application log. The last field is the
    # time taken in milliseconds. Turn it off with SERVER_TOMCAT_ACCESSLOG_ENABLED=false.
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      rotate: false
      buffered: false
      pattern: '[%h] %t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %{ms}T'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  default-produces-media-type: application/json
  model-converters:
    # Marks @Nullable properties as nullable.
    java-nullable-property-customizer:
      enabled: true
  # Stable key order, so the checked-in api/openapi.json only changes when the API does.
  writer-with-order-by-keys: true

dulo:
  data-dir: ./data
  database:
    url: jdbc:sqlite:${dulo.data-dir}/dulo.db
